name: Bug report
description: Something is not working as documented or expected.
title: 'bug: <short summary>'
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please complete the fields below — incomplete reports may be closed.
        For security vulnerabilities, see [SECURITY.md](https://github.com/amalitech-packages/.github/blob/main/SECURITY.md) instead.

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: e.g. 1.4.2
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small code snippet or a link to a repo that reproduces the issue. The smaller, the faster we can help.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and stack traces in a code block.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: e.g. 22.11.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14.5, Ubuntu 22.04, Windows 11
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — environment quirks, related issues, recent changes you made.
