name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The template repo itself must never release. Every repo created
    # from the template has a different name, so it will release normally.
    if: github.repository != 'amalitech-packages/package-template'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate npm publish access
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not configured. Add an npm Automation token with publish access to the @amali-tech scope."
            exit 1
          fi

          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          NPM_USER="$(npm whoami --registry=https://registry.npmjs.org/)"
          echo "Authenticated to npm as ${NPM_USER}"

          npm org ls amali-tech "${NPM_USER}" --registry=https://registry.npmjs.org/ >/dev/null || {
            echo "::error::NPM_TOKEN belongs to ${NPM_USER}, but that npm user is not visible as a member of the amali-tech org. Add the user to the npm org with publish rights, or replace NPM_TOKEN with a token from an authorized org member."
            exit 1
          }

          npm access list packages @amali-tech --registry=https://registry.npmjs.org/ >/dev/null || {
            echo "::error::NPM_TOKEN cannot list packages under the @amali-tech npm scope. Ensure ${NPM_USER} has publish access to public packages in the org."
            exit 1
          }

      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-package
          commit: 'chore: version package'
          title: 'chore: version package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
